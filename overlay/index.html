<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RacketStream overlay</title>
<link href="../fonts/archivo.css" rel="stylesheet">
<style>
  /* Scorebug compact (phase 5) — discret sur la vidéo : barre sombre
     translucide, points de couleur par camp, chiffres blancs. */
  :root {
    --team1: #2FE05C;   /* vert RacketStream — camp 1 */
    --team2: #E5484D;   /* rouge — camp 2 */
    --txt: #FFFFFF;
    --muted: rgba(255, 255, 255, 0.52);
    --scale: 1;
  }
  html, body {
    margin: 0; padding: 0; background: transparent;
    overflow: hidden; user-select: none;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #wrap { display: flex; justify-content: center; padding: 12px; transform: scale(var(--scale)); transform-origin: top center; }
  #bug {
    display: none;                       /* masqué tant qu'aucun match n'est trouvé */
    align-items: center;
    background: rgba(10, 12, 14, 0.66);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(8, 10, 12, 0.35);
    padding: 9px 18px;
    color: var(--txt);
    animation: arrive 0.4s ease-out;
  }
  @keyframes arrive { from { opacity: 0; transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { #bug { animation: none; } }

  .team { display: flex; align-items: center; min-width: 0; }
  .tcol { display: flex; flex-direction: column; gap: 3px; }
  .name {
    font-size: 23px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    line-height: 1; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pips { display: flex; gap: 5px; }
  .pip { width: 8px; height: 8px; border-radius: 2px; border: 1px solid rgba(255, 255, 255, 0.35); }
  .team.me .pip.won  { background: var(--team1); border-color: var(--team1); }
  .team.opp .pip.won { background: var(--team2); border-color: var(--team2); }

  .mid { display: flex; align-items: baseline; padding: 0 20px; }
  .pts {
    font-size: 54px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; min-width: 46px; text-align: center;
  }
  .colon { font-size: 40px; font-weight: 600; color: var(--muted); padding: 0 8px; }
  .pts.tick { animation: tick 0.3s ease-out; }
  @keyframes tick { 30% { transform: translateY(-4px) scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { .pts.tick { animation: none; } }

  .sep { width: 1px; align-self: stretch; margin: 2px 16px; background: rgba(255, 255, 255, 0.12); }
  .team.opp { margin-left: 0; }
  .setlab {
    font-size: 16px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted);
  }
  #empty {
    display: none; font-size: 20px; font-weight: 600; letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.75); background: rgba(10, 12, 14, 0.55);
    border-radius: 10px; padding: 12px 22px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="bug">
    <div class="team me">
      <div class="tcol">
        <div class="name" id="n1">MOI</div>
        <div class="pips" id="d1"></div>
      </div>
    </div>
    <div class="mid">
      <div class="pts" id="p1">0</div>
      <div class="colon">:</div>
      <div class="pts" id="p2">0</div>
    </div>
    <div class="team opp">
      <div class="tcol">
        <div class="name" id="n2">LUI</div>
        <div class="pips" id="d2"></div>
      </div>
    </div>
    <div class="sep"></div>
    <div class="setlab" id="setlab">SET 1</div>
  </div>
  <div id="empty">EN ATTENTE DE MATCH</div>
</div>
<script>
  // RacketStream overlay — lecture seule, zéro manipulation (plan phase 5).
  // Score poussé par l'API VPS (SSE /api/stream) ; /api/score en filet de
  // sécurité. Le choix du match (actif le plus récent, sinon le plus récent)
  // est fait côté serveur (pickScore), une seule implémentation.
  const q = new URLSearchParams(location.search);
  const API = (q.get("api") || "https://racket-stream.marc-suarez.fr").replace(/\/+$/, "");
  const CHANNEL = q.get("channel") || "marc";
  const SCALE = parseFloat(q.get("scale") || "1");
  const SHOW_PANELS = q.get("bg") !== "0";
  // Règle commune d'affichage (renderer VPS, portail, page club) : match en
  // cours (active, ou set_result entre deux sets) synchronisé depuis ≤ STALE_MS
  // — un match quitté reste « active » en base, c'est l'anti-fantôme — ; score
  // final (match_finished) pendant FINISHED_MS.
  const STALE_MS = 600 * 1000;
  const FINISHED_MS = 300 * 1000;
  function shown(r) {
    if (!r) return false;
    const max = r.status === "active" || r.status === "set_result" ? STALE_MS
      : r.status === "match_finished" ? FINISHED_MS : 0;
    return max > 0 && Date.now() - r.updated_at <= max;
  }
  // Noms : paramètres URL d'abord (rétro-compat), sinon réglages du canal
  // (portail) — c'est ce qui permet de changer d'adversaire sans toucher à OBS.
  const NAME1 = q.get("name1");
  const NAME2 = q.get("name2");

  document.getElementById("n1").textContent = NAME1 || "MOI";
  document.getElementById("n2").textContent = NAME2 || "LUI";
  const teamName = (a, b) => b ? `${a}/${b}` : a;
  if (NAME1 == null || NAME2 == null) {
    fetch(`${API}/functions/v1/names?channel=${encodeURIComponent(CHANNEL)}`)
      .then((r) => r.ok ? r.json() : null)
      .then((n) => {
        if (!n) return;
        if (NAME1 == null) document.getElementById("n1").textContent = teamName(n.name1, n.name1b);
        if (NAME2 == null) document.getElementById("n2").textContent = teamName(n.name2, n.name2b);
      })
      .catch(() => { /* hors ligne : défauts MOI/LUI */ });
  }
  if (!SHOW_PANELS) {
    const bug = document.getElementById("bug");
    bug.style.background = "transparent";
    bug.style.borderColor = "transparent";
    bug.style.boxShadow = "none";
    const se = document.querySelector(".sep");
    se.style.background = "rgba(255, 255, 255, 0.25)";
    document.querySelectorAll(".name, .pts, .setlab").forEach(el => {
      el.style.textShadow = "0 2px 8px rgba(0, 0, 0, 0.8)";
    });
  }
  if (SCALE !== 1) document.documentElement.style.setProperty("--scale", SCALE);

  function pips(el, won, setsToWin) {
    const total = Math.max(2, setsToWin);
    el.innerHTML = "";
    for (let i = 0; i < total; i++) {
      const p = document.createElement("div");
      p.className = "pip" + (won > i ? " won" : "");
      p.dataset.won = won > i ? "1" : "0";
      el.appendChild(p);
    }
  }

  function tick(id, value) {
    const el = document.getElementById(id);
    if (el.textContent !== String(value)) {
      el.textContent = value;
      el.classList.remove("tick");
      void el.offsetWidth;                    // relance l'animation
      el.classList.add("tick");
    }
  }

  function render(row) {
    document.getElementById("bug").style.display = "flex";
    document.getElementById("empty").style.display = "none";
    tick("p1", row.score_me);
    tick("p2", row.score_opp);
    const stw = (row.config && row.config.setsToWin) || 2;
    pips(document.getElementById("d1"), row.sets_me, stw);
    pips(document.getElementById("d2"), row.sets_opp, stw);
    document.getElementById("setlab").textContent = "SET " + row.current_set;
  }

  let last = null;
  function show(row) {
    last = row;
    if (shown(row)) { render(row); return; }
    document.getElementById("bug").style.display = "none";
    document.getElementById("empty").style.display = "block";
  }

  async function poll() {
    try {
      const r = await fetch(`${API}/api/score?channel=${encodeURIComponent(CHANNEL)}`, { cache: "no-store" });
      if (r.ok) show(await r.json());
    } catch { /* hors ligne : on garde l'affichage */ }
  }

  // EventSource se reconnecte seul ; il envoie l'état courant à l'ouverture.
  const es = new EventSource(`${API}/api/stream?channel=${encodeURIComponent(CHANNEL)}`);
  es.onmessage = (e) => { try { show(JSON.parse(e.data)); } catch { /* message invalide */ } };

  setInterval(poll, 10000);
  // Réévalue l'anti-fantôme même sans nouveau message.
  setInterval(() => { if (last) show(last); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  poll();
</script>
</body>
</html>
